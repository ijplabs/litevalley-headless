[package]
name = "litevalley-save-engine"
version = "0.4.0"
edition = "2021"
authors = ["LiteValley Cloud Team"]
description = "Zero-allocation savegame inspector, fast XML streamer, and chunked backup engine for Stardew Valley 1.6"

[dependencies]
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "time"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
walkdir = "2.5"
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
